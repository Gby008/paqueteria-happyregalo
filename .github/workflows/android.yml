name: Compilar APK Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Reconstruir keystore PAKAY
        env:
          PAKAY_KEYSTORE_BASE64: ${{ secrets.PAKAY_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="${RUNNER_TEMP}/pakay-release.keystore"
          printf '%s' "$PAKAY_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "PAKAY_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Compilar APK Release firmada
        env:
          PAKAY_STORE_PASSWORD: ${{ secrets.PAKAY_STORE_PASSWORD }}
          PAKAY_KEY_ALIAS: ${{ secrets.PAKAY_KEY_ALIAS }}
          PAKAY_KEY_PASSWORD: ${{ secrets.PAKAY_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Guardar APK PAKAY
        uses: actions/upload-artifact@v4
        with:
          name: PAKAY-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Eliminar keystore temporal
        if: always()
        run: rm -f "$PAKAY_KEYSTORE_PATH"
